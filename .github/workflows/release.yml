# Automatically build, test, and publish/update a GitHub Release whenever a version tag (v*) is pushed.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish/update (e.g. v0.3.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and run tests
        run: ./gradlew clean test build --no-daemon

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          shopt -s nullglob
          jars=(build/libs/*.jar)
          if [ ${#jars[@]} -eq 0 ]; then
            echo "No JAR files found in build/libs/" >&2
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${jars[@]}" --clobber
          else
            gh release create "$TAG" "${jars[@]}" \
              --title "Canopy Cavern ${TAG} (Minecraft 26.3)" \
              --generate-notes \
              --latest
          fi
